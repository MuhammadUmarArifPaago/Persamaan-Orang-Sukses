<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU ARE LIKE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0b2e 0%, #0a0410 100%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        #particles-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }

        .particle-heart {
            position: absolute;
            color: rgba(255, 192, 203, 0.3);
            font-size: 10px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        .card-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 3rem 2rem;

            background: rgba(42, 22, 53, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.05);

            text-align: center;
        }

        .overline {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .overline span {
            display: inline-block;
            margin: 0 5px;
            color: #d1c4e9;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        .subtitle-group {
            margin-bottom: 2rem;
        }

        .subtitle {
            font-size: 0.9rem;
            line-height: 1.7;
            color: #d1c4e9;
            font-weight: 300;
        }

        .progress {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.45);
            margin-bottom: 1.5rem;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            font-weight: 400;
            line-height: 1.5;
            padding: 1rem 1.2rem;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-align: left;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a4508b 0%, #5f0a87 100%);
            box-shadow: 0 4px 15px rgba(164, 80, 139, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        button:hover {
            transform: translateY(-2px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        .fade-out {
            animation: fadeOut 0.25s ease forwards;
        }

        .fade-in {
            animation: fadeIn 0.35s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .result-name {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .result-description {
            color: #d1c4e9;
            font-size: 0.9rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .restart-btn {
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #a4508b, #5f0a87);
        }

        @media (max-width: 600px) {
            .card-container {
                padding: 2.5rem 1.3rem;
                max-height: 92vh;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            button {
                font-size: 0.82rem;
                padding: 0.9rem 1rem;
            }
        }
    </style>
</head>

<body>

<div id="particles-container"></div>

<div class="card-container" id="quiz-card">

    <div class="overline">
        <span>✦</span> YOU ARE LIKE <span>✦</span>
    </div>

    <div class="progress" id="progress">
        QUESTION 1 OF 5
    </div>

    <h1 id="question-title">Question 1</h1>

    <div class="subtitle-group">
        <p class="subtitle" id="question-text"></p>
    </div>

    <div class="button-grid" id="answers"></div>

</div>

<script>

    // =====================================================
    // DATA PERTANYAAN
    // =====================================================

    const questions = [

        {
            question: "Saat menghadapi masalah besar, apa yang paling kamu lakukan?",
            answers: [
                "A. Turun langsung melihat masalah dan mencari solusi yang bisa segera dikerjakan.",
                "B. Berani mengambil keputusan besar dan menjalankannya dengan tegas.",
                "C. Memikirkan dampaknya dalam jangka panjang dan menjaga prinsip yang diyakini.",
                "D. Membangun komunikasi dan mencari dukungan dari berbagai pihak.",
                "E. Menyusun strategi, mengembangkan orang-orang di sekitar, lalu menjalankannya secara bertahap."
            ]
        },

        {
            question: "Kalau mendapat kesempatan membangun sesuatu dari nol, apa yang paling kamu prioritaskan?",
            answers: [
                "A. Membuat sesuatu yang langsung bisa digunakan dan dirasakan manfaatnya.",
                "B. Menentukan tujuan besar dan menggerakkan semua orang untuk mencapainya.",
                "C. Memastikan fondasinya kuat dan sesuai dengan nilai yang kamu percaya.",
                "D. Mencari orang-orang yang tepat untuk diajak bekerja sama.",
                "E. Membuat sistem yang bisa terus berkembang dalam jangka panjang."
            ]
        },

        {
            question: "Ketika banyak orang meragukan keputusanmu, apa yang kamu lakukan?",
            answers: [
                "A. Tetap bekerja dan membiarkan hasil yang berbicara.",
                "B. Tetap maju selama kamu yakin keputusan tersebut benar.",
                "C. Mendengarkan kritik, tetapi tidak meninggalkan prinsip yang kamu pegang.",
                "D. Mengajak mereka berdiskusi dan mencari titik temu.",
                "E. Mengevaluasi strategi dan memperbaikinya jika memang diperlukan."
            ]
        },

        {
            question: "Menurutmu, apa yang paling menentukan keberhasilan sebuah tim?",
            answers: [
                "A. Kerja nyata dan kemampuan menyelesaikan masalah.",
                "B. Pemimpin yang tegas dan mampu mengambil keputusan.",
                "C. Nilai, loyalitas, dan prinsip yang sama.",
                "D. Komunikasi serta hubungan yang baik antaranggota.",
                "E. Strategi, sistem, dan orang-orang yang terus berkembang."
            ]
        },

        {
            question: "Kalau suatu hari kamu menjadi pemimpin, warisan apa yang ingin kamu tinggalkan?",
            answers: [
                "A. Hasil nyata yang membuat kehidupan orang lain menjadi lebih baik.",
                "B. Organisasi atau negara yang kuat dan mandiri.",
                "C. Nilai dan perjuangan yang tetap diingat generasi berikutnya.",
                "D. Banyak orang yang tumbuh karena kesempatan yang kamu berikan.",
                "E. Sistem dan generasi penerus yang mampu melanjutkan apa yang sudah dibangun."
            ]
        }

    ];


    // =====================================================
    // PROFIL HASIL
    // =====================================================

    const profiles = {

        A: {
            icon: "🏗️",
            name: "Tipe Jokowi",
            title: "Sang Eksekutor",
            description:
                "Kamu adalah tipe yang lebih suka membuktikan sesuatu melalui tindakan. Kamu tidak puas hanya dengan rencana dan pembicaraan. Bagimu, ide yang baik adalah ide yang bisa diwujudkan menjadi hasil nyata."
        },

        B: {
            icon: "🦅",
            name: "Tipe Prabowo",
            title: "Sang Pemimpin",
            description:
                "Kamu cenderung berani mengambil keputusan dan menghadapi tekanan. Ketika memiliki tujuan besar, kamu ingin bergerak dengan tegas dan membangun fondasi yang kuat."
        },

        C: {
            icon: "🌹",
            name: "Tipe Megawati",
            title: "Sang Penjaga Prinsip",
            description:
                "Kamu adalah tipe yang tidak mudah meninggalkan prinsip. Bagimu, keberhasilan bukan hanya soal hasil akhir, tetapi juga nilai yang tetap dipertahankan sepanjang perjalanan."
        },

        D: {
            icon: "🤝",
            name: "Tipe Bahlil",
            title: "Sang Penggerak Peluang",
            description:
                "Kamu pandai melihat peluang dan membangun hubungan dengan orang lain. Kamu percaya bahwa banyak hal besar bisa terjadi ketika orang-orang yang tepat dipertemukan."
        },

        E: {
            icon: "📊",
            name: "Tipe Purbaya",
            title: "Sang Strategis",
            description:
                "Kamu cenderung berpikir sebelum bertindak. Kamu suka memahami situasi, menyusun strategi, dan memikirkan dampak keputusan dalam jangka panjang."
        }

    };


    // =====================================================
    // STATE QUIZ
    // =====================================================

    let currentQuestion = 0;

    const scores = {
        A: 0,
        B: 0,
        C: 0,
        D: 0,
        E: 0
    };


    // =====================================================
    // ELEMENT
    // =====================================================

    const card = document.getElementById("quiz-card");
    const questionTitle = document.getElementById("question-title");
    const questionText = document.getElementById("question-text");
    const answersContainer = document.getElementById("answers");
    const progress = document.getElementById("progress");


    // =====================================================
    // TAMPILKAN PERTANYAAN
    // =====================================================

    function showQuestion() {

        const q = questions[currentQuestion];

        questionTitle.textContent = `Question ${currentQuestion + 1}`;
        progress.textContent =
            `QUESTION ${currentQuestion + 1} OF ${questions.length}`;

        questionText.textContent = q.question;

        answersContainer.innerHTML = "";

        q.answers.forEach((answer, index) => {

            const button = document.createElement("button");

            button.className =
                index === 0 ? "btn-primary" : "btn-secondary";

            button.textContent = answer;

            button.onclick = () => selectAnswer(index);

            answersContainer.appendChild(button);

        });
    }


    // =====================================================
    // PILIH JAWABAN
    // =====================================================

    function selectAnswer(index) {

        const letter = ["A", "B", "C", "D", "E"][index];

        scores[letter]++;

        card.classList.add("fade-out");

        setTimeout(() => {

            currentQuestion++;

            if (currentQuestion < questions.length) {

                card.classList.remove("fade-out");
                card.classList.add("fade-in");

                showQuestion();

                setTimeout(() => {
                    card.classList.remove("fade-in");
                }, 400);

            } else {

                showResult();

            }

        }, 250);
    }


    // =====================================================
    // HITUNG HASIL
    // =====================================================

    function calculateResult() {

        let highestLetter = "A";
        let highestScore = scores.A;

        Object.keys(scores).forEach(letter => {

            if (scores[letter] > highestScore) {
                highestScore = scores[letter];
                highestLetter = letter;
            }

        });

        return highestLetter;
    }


    // =====================================================
    // TAMPILKAN HASIL
    // =====================================================

    function showResult() {

        const resultLetter = calculateResult();
        const profile = profiles[resultLetter];

        card.classList.remove("fade-out");

        card.innerHTML = `

            <div class="overline">
                <span>✦</span> YOUR RESULT <span>✦</span>
            </div>

            <div class="result-icon">
                ${profile.icon}
            </div>

            <div class="result-name">
                ${profile.name}
            </div>

            <div class="overline">
                ${profile.title}
            </div>

            <p class="result-description">
                ${profile.description}
            </p>

            <button
                class="restart-btn"
                onclick="restartQuiz()">
                COBA LAGI ✨
            </button>

        `;

        card.classList.add("fade-in");
    }


    // =====================================================
    // RESTART
    // =====================================================

    function restartQuiz() {

        currentQuestion = 0;

        scores.A = 0;
        scores.B = 0;
        scores.C = 0;
        scores.D = 0;
        scores.E = 0;

        card.innerHTML = `

            <div class="overline">
                <span>✦</span> YOU ARE LIKE <span>✦</span>
            </div>

            <div class="progress" id="progress">
                QUESTION 1 OF 5
            </div>

            <h1 id="question-title">
                Question 1
            </h1>

            <div class="subtitle-group">
                <p class="subtitle" id="question-text"></p>
            </div>

            <div class="button-grid" id="answers"></div>

        `;

        location.reload();
    }


    // =====================================================
    // PARTIKEL
    // =====================================================

    function createParticles() {

        const container =
            document.getElementById("particles-container");

        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {

            const isHeart = Math.random() > 0.8;

            const particle =
                document.createElement("div");

            if (isHeart) {

                particle.classList.add("particle-heart");
                particle.innerHTML = "♥";

            } else {

                particle.classList.add("particle");

                const size =
                    Math.random() * 3 + 1;

                particle.style.width =
                    `${size}px`;

                particle.style.height =
                    `${size}px`;
            }

            particle.style.left =
                `${Math.random() * 100}vw`;

            particle.style.animationDuration =
                `${Math.random() * 10 + 5}s`;

            particle.style.animationDelay =
                `${Math.random() * 5}s`;

            container.appendChild(particle);
        }
    }


    // =====================================================
    // START
    // =====================================================

    window.onload = () => {

        createParticles();
        showQuestion();

    };

</script>

</body>
</html>

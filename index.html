<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Tag viewport di bawah ini WAJIB ada agar rapi di semua device (HP/Tablet/PC) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Saya</title>
    <style>
        /* CSS Dasar Responsif */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background: #0073e6;
            color: #fff;
            padding: 2rem 1rem;
            text-align: center;
        }
        main {
            padding: 2rem 1rem;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #666;
        }
        /* Penyesuaian untuk layar HP */
        @media (max-width: 600px) {
            header {
                padding: 1.5rem 0.5rem;
            }
            main {
                margin: 10px;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Selamat Datang di Website Saya</h1>
        <p>Website sederhana ini di-host gratis menggunakan GitHub Pages.</p>
    </header>

    <main>
        <h2>Tentang Saya</h2>
        <p>Ini adalah halaman web sederhana yang responsif dan dapat diakses dengan baik di smartphone, tablet, maupun komputer desktop.</p>
    </main>

    <footer>
        <p>&copy; 2026 Website Saya</p>
    </footer>

</body>
</html>

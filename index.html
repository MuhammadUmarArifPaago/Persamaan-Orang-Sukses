// =====================================================

// =====================================================
// ELEMENT
// =====================================================

const card = document.getElementById("quiz-card");
const questionTitle = document.getElementById("question-title");
const questionText = document.getElementById("question-text");
const answersContainer = document.getElementById("answers");
const progress = document.getElementById("progress");


// =====================================================
// TAMPILKAN PERTANYAAN
// =====================================================

function showQuestion() {

    const q = questions[currentQuestion];

    questionTitle.textContent =
        `Question ${currentQuestion + 1}`;

    progress.textContent =
        `QUESTION ${currentQuestion + 1} OF ${questions.length}`;

    questionText.textContent =
        q.question;

    answersContainer.innerHTML = "";

    q.answers.forEach((answer, index) => {

        const button =
            document.createElement("button");

        // Jangan membuat A selalu terlihat paling menonjol
        button.className =
            "btn-secondary";

        button.textContent =
            answer;

        button.onclick =
            () => selectAnswer(index);

        answersContainer.appendChild(button);

    });
}


// =====================================================
// PILIH JAWABAN
// =====================================================

function selectAnswer(index) {

    const letters = ["A", "B", "C", "D", "E"];

    const selectedLetter =
        letters[index];

    // Ambil scoring pertanyaan saat ini
    const questionScore =
        scoring[currentQuestion];

    // Ambil skor jawaban yang dipilih
    const selectedScore =
        questionScore[selectedLetter];

    // Tambahkan poin
    Object.keys(selectedScore).forEach(profile => {

        scores[profile] +=
            selectedScore[profile];

    });


    // Animasi
    card.classList.add("fade-out");


    setTimeout(() => {

        currentQuestion++;

        if (currentQuestion < questions.length) {

            card.classList.remove("fade-out");

            card.classList.add("fade-in");

            showQuestion();

            setTimeout(() => {

                card.classList.remove("fade-in");

            }, 400);

        } else {

            showResult();

        }

    }, 250);
}


// =====================================================
// HITUNG HASIL
// =====================================================

function calculateResult() {

    let highestScore = -1;

    let winners = [];


    // Cari skor tertinggi
    profileNames.forEach(profile => {

        const score =
            scores[profile];

        if (score > highestScore) {

            highestScore =
                score;

            winners = [profile];

        }

        else if (score === highestScore) {

            winners.push(profile);

        }

    });


    // Jika ada seri,
    // gunakan tie-breaker berdasarkan jawaban terakhir
    if (winners.length > 1) {

        const lastLetter =
            getLastAnswerLetter();

        const lastScore =
            scoring[questions.length - 1][lastLetter];


        // Pilih pemenang seri yang mendapat
        // bobot lebih tinggi pada jawaban terakhir
        winners.sort((a, b) => {

            const scoreA =
                lastScore[a] || 0;

            const scoreB =
                lastScore[b] || 0;

            return scoreB - scoreA;

        });

    }


    return winners[0];
}


// =====================================================

// =====================================================

function getLastAnswerLetter() {

    if (answerHistory.length === 0) {
        return "A";
    }

    return answerHistory[
        answerHistory.length - 1
    ];
}


// =====================================================
// TAMPILKAN HASIL
// =====================================================

function showResult() {

    const resultProfile =
        calculateResult();

    const profile =
        profiles[resultProfile];


    card.classList.remove("fade-out");


    card.innerHTML = `

        <div class="overline">

            YOUR RESULT

        </div>

            ${profile.icon}

        <div class="result-name">
            ${profile.name}
        </div>

        <div class="overline">
            ${profile.title}
        </div>

        <p class="result-description">
            ${profile.description}
        </p>

        <button
            class="restart-btn"
            onclick="restartQuiz()">
            COBA LAGI ✨
        </button>

    `;

    card.classList.add("fade-in");
}


// =====================================================
// RESTART
// =====================================================

function restartQuiz() {

    currentQuestion = 0;

    answerHistory = [];

    profileNames.forEach(profile => {

        scores[profile] = 0;

    });

    location.reload();
}

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU ARE LIKE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Latar belakang serius (Slate Navy & Obsidian) */
            background: radial-gradient(circle at center, #1e293b 0%, #0b1329 100%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        #particles-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Styling Partikel Tanda Tanya */
        .particle-question {
            position: absolute;
            color: rgba(148, 163, 184, 0.18); /* Warna slate halus dengan transparansi */
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            user-select: none;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.1) rotate(15deg);
                opacity: 0;
            }
        }

        .card-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 3rem 2rem;

            /* Glassmorphism gelap netral */
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.03);

            text-align: center;
        }

        .overline {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .overline span {
            display: inline-block;
            margin: 0 5px;
            color: #38bdf8;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }

        .subtitle-group {
            margin-bottom: 2rem;
        }

        .subtitle {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #cbd5e1;
            font-weight: 300;
        }

        .progress {
            font-size: 0.75rem;
            color: #64748b;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            font-weight: 400;
            line-height: 1.5;
            padding: 1rem 1.2rem;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #f1f5f9;
            text-align: left;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        button:hover {
            transform: translateY(-2px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(56, 189, 248, 0.4);
            color: #ffffff;
        }

        button:active {
            transform: translateY(1px);
        }

        .fade-out {
            animation: fadeOut 0.25s ease forwards;
        }

        .fade-in {
            animation: fadeIn 0.35s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-image-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.2rem;
        }

        .result-img {
            width: 125px;
            height: 125px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .result-name {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #f8fafc;
        }

        .result-description {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .restart-btn {
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 4px 14px rgba(29, 78, 216, 0.35);
        }

        .restart-btn:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
        }

        @media (max-width: 600px) {
            .card-container {
                padding: 2.5rem 1.3rem;
                max-height: 92vh;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            button {
                font-size: 0.82rem;
                padding: 0.9rem 1rem;
            }
        }
    </style>
</head>

<body>

<div id="particles-container"></div>

<div class="card-container" id="quiz-card">
    <div class="overline">
        <span>✦</span> YOU ARE LIKE <span>✦</span>
    </div>

    <div class="progress" id="progress">
        QUESTION 1 OF 5
    </div>

    <h1 id="question-title">Question 1</h1>

    <div class="subtitle-group">
        <p class="subtitle" id="question-text"></p>
    </div>

    <div class="button-grid" id="answers"></div>
</div>

<script>

    // =====================================================
    // DATA PERTANYAAN
    // =====================================================

    const questions = [
        {
            question: "Saat menghadapi masalah besar, apa yang paling kamu lakukan?",
            answers: [
                "A. Turun ke lapangan & cari solusi cepat.",
                "B. Ambil keputusan tegas & berani.",
                "C. Jaga prinsip & dampak jangka panjang.",
                "D. Bangun komunikasi & cari dukungan.",
                "E. Susun strategi & eksekusi bertahap."
            ]
        },
        {
            question: "Kalau mendapat kesempatan membangun sesuatu dari nol, apa prioritasmu?",
            answers: [
                "A. Hasil nyata yang langsung terasa.",
                "B. Visi besar & menggerakkan tim.",
                "C. Fondasi kuat sesuai nilai yang diyakini.",
                "D. Rangkul orang-orang yang tepat.",
                "E. Buat sistem yang berkelanjutan."
            ]
        },
        {
            question: "Ketika banyak orang meragukan keputusanmu, apa yang kamu lakukan?",
            answers: [
                "A. Buktikan langsung lewat hasil kerja.",
                "B. Tetap maju dengan penuh keyakinan.",
                "C. Dengar kritik, tapi pegang teguh prinsip.",
                "D. Ajak diskusi & cari titik temu.",
                "E. Evaluasi ulang & perbaiki strategi."
            ]
        },
        {
            question: "Menurutmu, apa yang paling menentukan keberhasilan sebuah tim?",
            answers: [
                "A. Aksi nyata & eksekusi cepat.",
                "B. Kepemimpinan yang tegas.",
                "C. Integritas & prinsip yang sama.",
                "D. Komunikasi & hubungan yang baik.",
                "E. Strategi matang & sistem yang rapi."
            ]
        },
        {
            question: "Jika menjadi pemimpin, warisan apa yang ingin kamu tinggalkan?",
            answers: [
                "A. Manfaat nyata bagi masyarakat.",
                "B. Organisasi yang kuat & mandiri.",
                "C. Nilai & rekam jejak perjuangan.",
                "D. Melahirkan banyak orang hebat baru.",
                "E. Sistem kokoh yang terus berlanjut."
            ]
        }
    ];

    // =====================================================
    // PROFIL HASIL
    // =====================================================

    const profiles = {
        JOKOWI: {
            icon: "🏗️",
            image: "images/jokowi.jpg",
            name: "Tipe Jokowi",
            title: "Sang Eksekutor",
            description: "Kamu adalah tipe yang lebih suka membuktikan sesuatu melalui tindakan. Kamu tidak puas hanya dengan rencana dan pembicaraan. Bagimu, ide yang baik adalah ide yang bisa diwujudkan menjadi hasil nyata."
        },
        GIBRAN: {
            icon: "🚀",
            image: "images/gibran.jpg",
            name: "Tipe Gibran",
            title: "Sang Pembawa Perubahan",
            description: "Kamu cenderung terbuka terhadap perubahan dan berani mencoba pendekatan baru. Kamu suka melihat peluang di tengah perubahan dan tertarik pada ide yang bisa membawa sesuatu menuju arah yang berbeda."
        },
        MEGAWATI: {
            icon: "🌹",
            image: "images/mega.jpg",
            name: "Tipe Megawati",
            title: "Sang Penjaga Prinsip",
            description: "Kamu adalah tipe yang tidak mudah meninggalkan prinsip. Bagimu, keberhasilan bukan hanya soal hasil akhir, tetapi juga nilai yang tetap dipertahankan sepanjang perjalanan."
        },
        BAHLIL: {
            icon: "💼",
            image: "images/bahlil.jpg",
            name: "Tipe Bahlil",
            title: "Sang Penggerak Peluang",
            description: "Kamu pandai melihat peluang dan membangun hubungan dengan orang lain. Kamu percaya bahwa banyak hal besar bisa terjadi ketika orang-orang yang tepat dipertemukan dan sebuah peluang berani dimanfaatkan."
        },
        PURBAYA: {
            icon: "📊",
            image: "images/purbaya.jpg",
            name: "Tipe Purbaya",
            title: "Sang Strategis",
            description: "Kamu cenderung berpikir sebelum bertindak. Kamu suka memahami situasi, melihat data dan berbagai kemungkinan, kemudian menyusun strategi dengan mempertimbangkan dampaknya dalam jangka panjang."
        },
        HATTA: {
            icon: "📚",
            image: "images/habibie.jpg",
            name: "Tipe Habibie",
            title: "Sang Intelektual",
            description: "Kamu percaya bahwa pengetahuan dan pemikiran yang matang adalah fondasi penting untuk mencapai sesuatu yang besar. Kamu suka belajar, memahami persoalan secara mendalam, dan mencari solusi berdasarkan pemikiran yang rasional."
        },
        PRABOWO: {
            icon: "🦅",
            image: "images/prabowo.jpg",
            name: "Tipe Prabowo",
            title: "Sang Pemimpin",
            description: "Kamu cenderung berani mengambil keputusan dan menghadapi tekanan. Ketika memiliki tujuan besar, kamu ingin bergerak dengan tegas, membangun fondasi yang kuat, dan memastikan tujuan tersebut dapat diwujudkan."
        },
        GUFRON: {
            icon: "🔬",
            image: "images/gufron.jpg",
            name: "Tipe Gufron",
            title: "Sang Inovator",
            description: "Kamu senang mencari cara baru untuk menyelesaikan masalah. Daripada selalu mengikuti cara lama, kamu cenderung bertanya apakah ada pendekatan yang lebih kreatif, efektif, dan relevan dengan masa depan."
        },
        SUHARTO: {
            icon: "🏛️",
            image: "images/suharto.jpg",
            name: "Tipe Suharto",
            title: "Sang Pengelola",
            description: "Kamu cenderung menyukai struktur, keteraturan, dan arah yang jelas. Kamu percaya bahwa sesuatu yang besar membutuhkan organisasi yang rapi, sistem yang kuat, serta kemampuan menjaga stabilitas dalam jangka panjang."
        },
        PUAN: {
            icon: "🤝",
            image: "images/puan.jpg",
            name: "Tipe Puan",
            title: "Sang Koordinator",
            description: "Kamu cenderung kuat dalam membangun komunikasi dan menghubungkan berbagai orang. Kamu memahami bahwa tujuan besar membutuhkan kerja sama, koordinasi, dan kemampuan mencari titik temu di antara berbagai kepentingan."
        }
    };

    // =====================================================
    // STATE & SCORING
    // =====================================================

    let currentQuestion = 0;
    let answerHistory = [];

    const profileNames = [
        "JOKOWI", "GIBRAN", "MEGAWATI", "BAHLIL", "PURBAYA",
        "HATTA", "PRABOWO", "GUFRON", "SUHARTO", "PUAN"
    ];

    const scores = {};
    profileNames.forEach(profile => {
        scores[profile] = 0;
    });

    const scoring = [
        // QUESTION 1
        {
            A: { JOKOWI: 4, PURBAYA: 3, PUAN: 2, GUFRON: 1 },
            B: { PRABOWO: 4, GIBRAN: 3, SUHARTO: 2, BAHLIL: 1 },
            C: { MEGAWATI: 4, HATTA: 3, SUHARTO: 2, PUAN: 1 },
            D: { BAHLIL: 4, PUAN: 3, GIBRAN: 2, JOKOWI: 1 },
            E: { PURBAYA: 4, HATTA: 3, GUFRON: 2, PRABOWO: 1 }
        },
        // QUESTION 2
        {
            A: { GUFRON: 4, JOKOWI: 3, GIBRAN: 2, HATTA: 1 },
            B: { SUHARTO: 4, PRABOWO: 3, JOKOWI: 2, PUAN: 1 },
            C: { HATTA: 4, MEGAWATI: 3, PURBAYA: 2, SUHARTO: 1 },
            D: { BAHLIL: 4, GIBRAN: 3, PUAN: 2, GUFRON: 1 },
            E: { PURBAYA: 4, PUAN: 3, SUHARTO: 2, HATTA: 1 }
        },
        // QUESTION 3
        {
            A: { JOKOWI: 4, HATTA: 3, GIBRAN: 2, BAHLIL: 1 },
            B: { PRABOWO: 4, MEGAWATI: 3, SUHARTO: 2, PUAN: 1 },
            C: { MEGAWATI: 4, HATTA: 3, PUAN: 2, PURBAYA: 1 },
            D: { PUAN: 4, BAHLIL: 3, GIBRAN: 2, JOKOWI: 1 },
            E: { PURBAYA: 4, GUFRON: 3, HATTA: 2, PRABOWO: 1 }
        },
        // QUESTION 4
        {
            A: { JOKOWI: 4, PRABOWO: 3, BAHLIL: 2, GUFRON: 1 },
            B: { PRABOWO: 4, PUAN: 3, SUHARTO: 2, GIBRAN: 1 },
            C: { MEGAWATI: 4, HATTA: 3, SUHARTO: 2, PUAN: 1 },
            D: { PUAN: 4, BAHLIL: 3, GIBRAN: 2, HATTA: 1 },
            E: { PURBAYA: 4, GUFRON: 3, JOKOWI: 2, SUHARTO: 1 }
        },
        // QUESTION 5
        {
            A: { JOKOWI: 4, GIBRAN: 3, PUAN: 2, HATTA: 1 },
            B: { PRABOWO: 4, SUHARTO: 3, JOKOWI: 2, MEGAWATI: 1 },
            C: { MEGAWATI: 4, HATTA: 3, PURBAYA: 2, GUFRON: 1 },
            D: { BAHLIL: 4, PUAN: 3, GIBRAN: 2, PRABOWO: 1 },
            E: { PURBAYA: 4, GUFRON: 3, SUHARTO: 2, BAHLIL: 1 }
        }
    ];

    // =====================================================
    // ELEMENTS
    // =====================================================

    const card = document.getElementById("quiz-card");
    const questionTitle = document.getElementById("question-title");
    const questionText = document.getElementById("question-text");
    const answersContainer = document.getElementById("answers");
    const progress = document.getElementById("progress");

    // =====================================================
    // TAMPILKAN PERTANYAAN
    // =====================================================

    function showQuestion() {
        const q = questions[currentQuestion];

        questionTitle.textContent = `Question ${currentQuestion + 1}`;
        progress.textContent = `QUESTION ${currentQuestion + 1} OF ${questions.length}`;
        questionText.textContent = q.question;

        answersContainer.innerHTML = "";

        q.answers.forEach((answer, index) => {
            const button = document.createElement("button");
            button.className = "btn-secondary";
            button.textContent = answer;
            button.onclick = () => selectAnswer(index);
            answersContainer.appendChild(button);
        });
    }

    // =====================================================
    // PILIH JAWABAN
    // =====================================================

    function selectAnswer(index) {
        const letters = ["A", "B", "C", "D", "E"];
        const selectedLetter = letters[index];

        answerHistory.push(selectedLetter);

        const questionScore = scoring[currentQuestion];
        const selectedScore = questionScore[selectedLetter];

        Object.keys(selectedScore).forEach(profile => {
            scores[profile] += selectedScore[profile];
        });

        card.classList.add("fade-out");

        setTimeout(() => {
            currentQuestion++;

            if (currentQuestion < questions.length) {
                card.classList.remove("fade-out");
                card.classList.add("fade-in");
                showQuestion();

                setTimeout(() => {
                    card.classList.remove("fade-in");
                }, 400);
            } else {
                showResult();
            }
        }, 250);
    }

    // =====================================================
    // HITUNG HASIL
    // =====================================================

    function calculateResult() {
        let highestScore = -1;
        let winners = [];

        profileNames.forEach(profile => {
            const score = scores[profile];
            if (score > highestScore) {
                highestScore = score;
                winners = [profile];
            } else if (score === highestScore) {
                winners.push(profile);
            }
        });

        if (winners.length > 1) {
            const lastLetter = getLastAnswerLetter();
            const lastScore = scoring[questions.length - 1][lastLetter];

            winners.sort((a, b) => {
                const scoreA = lastScore[a] || 0;
                const scoreB = lastScore[b] || 0;
                return scoreB - scoreA;
            });
        }

        return winners[0];
    }

    function getLastAnswerLetter() {
        if (answerHistory.length === 0) return "A";
        return answerHistory[answerHistory.length - 1];
    }

    // =====================================================
    // TAMPILKAN HASIL
    // =====================================================

    function showResult() {
        const resultProfile = calculateResult();
        const profile = profiles[resultProfile];

        card.classList.remove("fade-out");

        card.innerHTML = `
            <div class="overline">
                <span>✦</span> YOUR RESULT <span>✦</span>
            </div>
            
            <div class="result-image-wrapper">
                <img src="${profile.image}" alt="${profile.name}" class="result-img">
            </div>

            <div class="result-name">
                ${profile.name}
            </div>
            <div class="overline">
                ${profile.title}
            </div>
            <p class="result-description">
                ${profile.description}
            </p>
            <button class="restart-btn" onclick="restartQuiz()">
                COBA LAGI ↺
            </button>
        `;

        card.classList.add("fade-in");
    }

    // =====================================================
    // RESTART
    // =====================================================

    function restartQuiz() {
        location.reload();
    }

    // =====================================================
    // ANIMASI PARTIKEL TANDA TANYA (?)
    // =====================================================

    function createParticles() {
        const container = document.getElementById("particles-container");
        const particleCount = 28;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement("div");
            particle.className = "particle-question";
            particle.innerHTML = "?";

            // Ukuran font acak antara 14px - 32px
            const fontSize = Math.random() * 18 + 14;
            particle.style.fontSize = `${fontSize}px`;

            // Posisi horizontal acak (0% - 100%)
            particle.style.left = `${Math.random() * 100}%`;

            // Durasi animasi & delay acak
            particle.style.animationDuration = `${Math.random() * 10 + 8}s`;
            particle.style.animationDelay = `${Math.random() * 6}s`;

            container.appendChild(particle);
        }
    }

    // =====================================================
    // JALANKAN SAAT HALAMAN PERTAMA DIBUKA
    // =====================================================
    createParticles();
    showQuestion();

</script>

</body>
</html>
